<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirm Order | Fashion Mart</title><style>
:root{--pink:#c52b72;--pink2:#f4d9e7;--ink:#24212b;--muted:#73717b;--bg:#f6f6f8;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
.top{background:#fff;display:flex;align-items:center;gap:18px;padding:13px 5%;box-shadow:0 2px 10px #0000000b;position:sticky;top:0;z-index:10}
.logo{font-size:24px;font-weight:900;color:var(--pink);white-space:nowrap;cursor:pointer}.search{flex:1}.search input{width:100%;padding:12px 15px;border:1px solid #ddd;border-radius:9px;font-size:15px}
.nav{display:flex;gap:12px;overflow:auto;background:white;padding:14px 5%;scrollbar-width:thin}.category{border:0;background:transparent;min-width:75px;text-align:center;cursor:pointer;color:#35323b;padding:4px}
.category .emoji{height:54px;width:54px;border-radius:50%;display:grid;place-items:center;margin:0 auto 7px;background:#fce7f0;font-size:26px}.category b{font-size:12px;white-space:nowrap}.category.active .emoji{outline:2px solid var(--pink)}
.banner{margin:20px 5%;border-radius:18px;min-height:210px;padding:28px 5%;display:flex;justify-content:space-between;align-items:center;color:#fff;background:linear-gradient(115deg,#4a1431,#b6296e 62%,#ed94bd);overflow:hidden}
.banner h1{font-size:clamp(26px,4vw,44px);margin:10px 0}.banner p{margin:0 0 16px}.banner .tag{font-size:13px;letter-spacing:2px;font-weight:bold}.burst{font-size:clamp(34px,7vw,70px);font-weight:900;text-align:center;line-height:1}
.section{padding:10px 5% 14px;font-size:22px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px;padding:0 5% 36px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 3px 13px #00000009}.card img{display:block;width:100%;height:225px;object-fit:contain;padding:8px;background:#fff}.info{padding:12px}.name{font-size:14px;line-height:1.4;min-height:38px}.price{font-size:18px;font-weight:800;margin-top:8px}.buy{width:100%;margin-top:10px;border:0;border-radius:7px;background:var(--pink);color:white;padding:11px;font-weight:bold;cursor:pointer}
.btn{border:0;border-radius:9px;background:var(--pink);color:white;padding:13px 20px;font-weight:bold;cursor:pointer}.btn.light{background:#fff;color:var(--pink)}.back{margin:20px 5%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer}
.panel{margin:8px auto 35px;max-width:980px;background:white;border-radius:16px;padding:24px;box-shadow:0 5px 20px #00000008}.product-detail{display:grid;grid-template-columns:minmax(250px,1fr) 1fr;gap:28px;align-items:center}.product-detail img{width:100%;max-height:490px;object-fit:contain;background:#fff}.detail-name{font-size:26px;margin:0 0 12px}.detail-price{font-size:30px;font-weight:900;color:var(--pink)}.muted{color:var(--muted);line-height:1.6}.confirm-layout{display:grid;grid-template-columns:1fr 1fr;gap:25px;align-items:center}.confirm-layout img{width:100%;max-height:500px;object-fit:contain}.empty{padding:25px 5%;color:var(--muted)}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.top{padding:12px 3%;gap:10px}.logo{font-size:20px}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding-left:3%;padding-right:3%}.card img{height:180px}.banner{margin:13px 3%;min-height:170px;padding:20px}.banner .burst{font-size:35px}.product-detail,.confirm-layout{grid-template-columns:1fr}.panel{margin:8px 3% 25px;padding:17px}.detail-name{font-size:22px}.top{flex-wrap:wrap}.search{flex-basis:100%;order:3}}
</style></head><body>
<header class="top"><div class="logo" onclick="location.href='index.html'">Fashion Mart</div><div class="search"><input placeholder="Confirm your order" disabled></div></header>
<button class="back" onclick="history.back()">← Back</button><div class="section">Confirm Your Order</div><main class="panel"><div id="confirmbox" class="confirm-layout"></div></main>
<script>
const GENERAL_FORM="https://surveyheart.com/form/6addb7e0ffacbb0045b09cba", BABY_FORM="https://surveyheart.com/form/6ada4fb9cc50420ac1f9304a";
let catalog={categories:[],products:[]}, activeCategory='All Products', query='';
async function loadCatalog(){const r=await fetch('catalog.json');catalog=await r.json();}
function categoryNav(){
 const el=document.getElementById('categories');if(!el)return;
 el.innerHTML=catalog.categories.map(c=>`<button class="category ${activeCategory===c.name?'active':''}" onclick="filterCategory(${JSON.stringify(c.name)})"><span class="emoji">${c.icon}</span><b>${c.name}</b></button>`).join('');
}
function showProducts(){
 const el=document.getElementById('products');if(!el)return;
 let arr=catalog.products.filter(p=>(activeCategory==='All Products'||p.category===activeCategory)&&(`${p.name} ${p.category}`).toLowerCase().includes(query.toLowerCase()));
 document.getElementById('heading').textContent=query?`Search: ${query}`:activeCategory==='All Products'?'🔥 Best Sale Products':activeCategory;
 el.innerHTML=arr.length?arr.map(p=>`<article class="card"><img loading="lazy" src="${p.image}" alt="${p.name}"><div class="info"><div class="name">${p.name}</div><div class="price">₹${p.price}</div><button class="buy" onclick="goOrder(${p.id})">BUY NOW</button></div></article>`).join(''):'<div class="empty">Is category mein abhi product nahi mila.</div>';
}
function filterCategory(c){activeCategory=c;query='';let s=document.getElementById('search');if(s)s.value='';categoryNav();showProducts();window.scrollTo(0,0)}
function searchInput(v){query=v;activeCategory='All Products';categoryNav();showProducts()}
function goOrder(id){location.href='order.html?id='+id}
function formFor(p){return p.category==='Baby Clothing'?BABY_FORM:GENERAL_FORM}
function money(n){return '₹'+Number(n).toLocaleString('en-IN')}

(async()=>{await loadCatalog();const id=Number(new URLSearchParams(location.search).get('id'));const p=catalog.products.find(x=>x.id===id);if(!p){document.getElementById('confirmbox').innerHTML='Product not found';return}
document.getElementById('confirmbox').innerHTML=`<img src="${p.image}" alt="${p.name}"><div><div class="muted">ORDER SUMMARY</div><h1 class="detail-name">${p.name}</h1><div class="detail-price">${money(p.price)}</div><p class="muted">Your selected product is ready. Continue to the order address form.</p><button class="btn" onclick="location.href=formFor(catalog.products.find(x=>x.id===${p.id}))">CONTINUE TO ADDRESS</button></div>`;})();
</script></body></html>
